<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 200px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .response {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>API Test Page</h1>
    
    <!-- Main Categories Test -->
    <div class="test-section">
        <h2>Test Main Categories API</h2>
        <div class="form-group">
            <label for="country1">Country:</label>
            <input type="text" id="country1" value="US" placeholder="e.g., US, UK, etc.">
        </div>
        <div class="form-group">
            <label for="language1">Language:</label>
            <select id="language1">
                <option value="en">English (en)</option>
                <option value="ar">Arabic (ar)</option>
                <option value="tr">Turkish (tr)</option>
            </select>
        </div>
        <button onclick="testMainCategories()">Test Main Categories</button>
        <div id="mainCategoriesResponse" class="response"></div>
    </div>

    <!-- Boutiques Test -->
    <div class="test-section">
        <h2>Test Boutiques API</h2>
        <div class="form-group">
            <label for="country2">Country:</label>
            <input type="text" id="country2" value="US" placeholder="e.g., US, UK, etc.">
        </div>
        <div class="form-group">
            <label for="language2">Language:</label>
            <select id="language2">
                <option value="en">English (en)</option>
                <option value="ar">Arabic (ar)</option>
                <option value="tr">Turkish (tr)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="limit">Limit:</label>
            <input type="number" id="limit" value="5" min="1" max="100">
        </div>
        <div class="form-group">
            <label for="offset">Offset:</label>
            <input type="number" id="offset" value="0" min="0">
        </div>
        <div class="form-group">
            <label for="categorySlug">Category Slug (optional):</label>
            <input type="text" id="categorySlug" placeholder="e.g., womens-fashion">
        </div>
        <button onclick="testBoutiques()">Test Boutiques</button>
        <div id="boutiquesResponse" class="response"></div>
    </div>

    <script>
        async function testMainCategories() {
            const country = document.getElementById('country1').value;
            const language = document.getElementById('language1').value;
            const responseDiv = document.getElementById('mainCategoriesResponse');
            
            try {
                responseDiv.textContent = 'Loading...';
                responseDiv.className = 'response';
                
                const response = await fetch('/api/home/mainCategories', {
                    method: 'GET',
                    headers: {
                        'country': country,
                        'language': language
                    }
                });
                
                const data = await response.json();
                
                responseDiv.textContent = JSON.stringify(data, null, 2);
                responseDiv.className = response.ok ? 'response success' : 'response error';
                
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                responseDiv.className = 'response error';
            }
        }

        async function testBoutiques() {
            const country = document.getElementById('country2').value;
            const language = document.getElementById('language2').value;
            const limit = document.getElementById('limit').value;
            const offset = document.getElementById('offset').value;
            const categorySlug = document.getElementById('categorySlug').value;
            const responseDiv = document.getElementById('boutiquesResponse');
            
            try {
                responseDiv.textContent = 'Loading...';
                responseDiv.className = 'response';
                
                // Build query parameters
                const params = new URLSearchParams({
                    limit: limit,
                    offset: offset
                });
                
                if (categorySlug) {
                    params.append('category_slug', categorySlug);
                }
                
                const response = await fetch(`/api/home/boutiques?${params}`, {
                    method: 'GET',
                    headers: {
                        'country': country,
                        'language': language
                    }
                });
                
                const data = await response.json();
                
                responseDiv.textContent = JSON.stringify(data, null, 2);
                responseDiv.className = response.ok ? 'response success' : 'response error';
                
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                responseDiv.className = 'response error';
            }
        }
    </script>
</body>
</html>
