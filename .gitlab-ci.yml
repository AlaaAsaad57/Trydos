stages:
  - test

cypress_test:
  image: cypress/browsers:node-20.5.0-chrome-114.0.5735.133-1-ff-114.0.2-edge-114.0.1823.51-1
  stage: test

  script:
    - npm i  --legacy-peer-deps
    - npm ci --legacy-peer-deps
    - npm run test

  artifacts:
    when: on_success
    paths:
      - cypress/screenshots
      - cypress/videos
      - cypress/reports
