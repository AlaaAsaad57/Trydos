stages:
  - build and deploy
  - test

deploy-to-vercel:
  stage: build and deploy
  image: node:20.0.0

  script:
    - npm i -g vercel
    - npm i  --legacy-peer-deps
    - npx next build
    - vercel --token RxBPi4PALYovZWQxdtbXQmAM > vercel_deployment_url.txt

  artifacts:
    when: on_success
    paths:
      - vercel_deployment_url.txt

cypress_test:
  image: cypress/browsers:node-20.5.0-chrome-114.0.5735.133-1-ff-114.0.2-edge-114.0.1823.51-1
  stage: test

  script:
    - DEPLOYMENT_URL=$(cat vercel_deployment_url.txt)
    - npm i  --legacy-peer-deps
    - npm ci --legacy-peer-deps
    - npm run test --env CYPRESS_BASE_URL=https://trydos-front-git-development-trydos-front-team.vercel.app

  artifacts:
    when: on_success
    paths:
      - cypress/screenshots
      - cypress/videos
