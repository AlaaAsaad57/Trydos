version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Version-update PRs open against develop, the working trunk. Note this does
    # NOT move the security alerts: GitHub computes those from the default branch
    # (main) only, and target-branch has no effect on them. Until develop is made
    # the default, the alert list keeps describing main's tree, not this one.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Next.js ships framework packages in lockstep; splitting them across PRs
      # produces version skew that fails the build.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      sentry:
        patterns:
          - "@sentry/*"
      firebase:
        patterns:
          - "firebase"
          - "firebase-admin"
          - "@firebase/*"
      # Everything else, batched by risk so patch noise stays in one PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned deliberately in package.json; let the humans move these.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
