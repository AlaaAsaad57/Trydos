# One Telegram message, sent on behalf of whichever workflow called it.
#
# It is reusable (`workflow_call`) so the bot token is handled in exactly one
# file. It decides nothing: the caller works out what happened and passes the
# pieces in, this file only formats and sends them.
#
# Three rules it must keep:
#
#   * It can never change the verdict of the run that called it. The send step
#     carries `continue-on-error`, so Telegram being unreachable cannot turn a
#     green test run red. A failed send is printed in this job's log instead.
#   * Not configured is not a failure. With no TELEGRAM_BOT_TOKEN or
#     TELEGRAM_CHAT_ID it exits 0 quietly — which is also exactly what happens
#     on a pull request from a fork, where secrets are never exposed.
#   * The message never says *why* a test failed. It names the tests that broke
#     and stops; the reason is written beside the test in the attached file. See
#     the Failures block below for the reasoning.
#
# Set up once, outside this repo: create the bot with @BotFather, add it to the
# channel as an *administrator* (a plain member cannot post), then store the
# token and the channel id as repository secrets.

name: Telegram notification

on:
  workflow_call:
    inputs:
      result:
        description: 'What is being reported: success, failure or cancelled'
        required: true
        type: string
      title:
        description: 'What ran, e.g. "Tests · push"'
        required: true
        type: string
      steps:
        description: 'One line naming each step and how it went'
        required: false
        default: ''
        type: string
      failures:
        description: >
          The first few failing test names, one per line. **Names only.** Why
          each one failed belongs in `tree`, beside the test it broke on — never
          here. See the note on the Failures block below.
        required: false
        default: ''
        type: string
      totals:
        description: 'Test counts, e.g. "unit 756 passed"'
        required: false
        default: ''
        type: string
      coverage:
        description: 'Coverage percentages, e.g. "lines 6.1%  stmts 6.1%  …"'
        required: false
        default: ''
        type: string
      rollup:
        description: 'One line per test file, ticked or crossed, with its count'
        required: false
        default: ''
        type: string
      tree:
        description: >
          Every describe and every test, ticked or crossed, with the reason
          printed under each failing one. Sent as an attached file, not in the
          message — a thousand ticks do not fit in 4096 characters, and this is
          the only place a failure reason is written. Travels as text because
          the caller is a different job on a different machine, so a file it
          wrote does not exist here.
        required: false
        default: ''
        type: string
      tree_name:
        description: 'What to call the attached file'
        required: false
        default: 'tests.txt'
        type: string
      video_url:
        description: >
          Link to the uploaded session recording, if the caller made one. It is
          a link and never the recording itself: the file is encrypted, and
          Telegram is not the place to hand out a copy of a real session.
        required: false
        default: ''
        type: string

# It reads nothing from the repository and checks nothing out.
permissions: {}

jobs:
  send:
    name: Send
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send the result to Telegram
        # See the note at the top: a notification must never decide a build.
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ inputs.result }}
          TITLE: ${{ inputs.title }}
          STEP_LINE: ${{ inputs.steps }}
          FAILURES: ${{ inputs.failures }}
          TOTALS: ${{ inputs.totals }}
          COVERAGE: ${{ inputs.coverage }}
          ROLLUP: ${{ inputs.rollup }}
          TREE: ${{ inputs.tree }}
          TREE_NAME: ${{ inputs.tree_name }}
          VIDEO_URL: ${{ inputs.video_url }}
          # Only a push carries a commit object. Everywhere else this is empty
          # and the subject line is simply left off.
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -u
          # Never `set -x` here. GitHub masks secrets in logs on a best-effort
          # basis, and a traced curl line is the classic way to defeat it.

          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set — nothing sent."
            exit 0
          fi

          # parse_mode is HTML, so only these three characters need escaping.
          # MarkdownV2 would need . - ( ) ! and several more escaped, and any
          # test name or branch name containing one would come back as a 400.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          case "$RESULT" in
            success)   ICON='✅' ;;
            failure)   ICON='❌' ;;
            cancelled) ICON='🚫' ;;
            *)         ICON='⚠️' ;;
          esac

          NL=$'\n'
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          SUBJECT=$(printf '%s' "$COMMIT_SUBJECT" | head -n 1)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          LINE="<code>$(esc "$GITHUB_REF_NAME")</code> · <code>$SHORT_SHA</code>"
          if [ -n "$SUBJECT" ]; then
            LINE="$LINE — $(esc "$SUBJECT")"
          fi

          # The message is assembled by a function rather than in place, because
          # it has to be built twice: once with the per-file rollup and, if that
          # comes out over the limit, once without it. Rebuilding is the only way
          # to drop a middle section without leaving a half-closed HTML tag.
          build() {
            local with_rollup="$1"
            local out="$ICON <b>$(esc "$TITLE")</b>${NL}${LINE}"

            if [ "$RESULT" = "success" ]; then
              # Green: the numbers. Coverage is the point of this message —
              # a passing run that says nothing is a run nobody learns from.
              if [ -n "$TOTALS" ]; then
                out="$out${NL}${NL}$(esc "$TOTALS")"
              fi
              if [ -n "$COVERAGE" ]; then
                out="$out${NL}coverage — $(esc "$COVERAGE")"
              fi
            else
              # Red: what broke, and how the other steps did — so one broken step
              # is not read as everything being broken.
              if [ -n "$STEP_LINE" ]; then
                out="$out${NL}${NL}$(esc "$STEP_LINE")"
              fi
              # The counts belong here too. "3 failed" reads very differently
              # depending on whether 2 or 200 passed alongside it, and a red
              # message that only lists names cannot tell you which it was.
              if [ -n "$TOTALS" ]; then
                out="$out${NL}$(esc "$TOTALS")"
              fi
              # The names of the tests that broke — and only the names.
              #
              # **No failure reason goes in this message.** Not here, not
              # anywhere else in it. An error is several lines per failure, so a
              # handful of them is what pushes the message past the 4096-character
              # limit and costs the counts and the rollup below; and a reason read
              # away from its own test says much less than the same reason read
              # under it. Both reporters therefore send names here and write the
              # reason into the attached tree instead. Do not add it back.
              if [ -n "$FAILURES" ]; then
                out="$out${NL}${NL}<b>Failures</b>${NL}<pre>$(esc "$FAILURES")</pre>"
              fi
            fi

            # One line per test file with a tick or a cross. This is the level
            # that fits: forty files fit in a message, a thousand tests do not,
            # and those go in the attached file below.
            if [ "$with_rollup" = "yes" ] && [ -n "$ROLLUP" ]; then
              out="$out${NL}${NL}<b>By file</b>${NL}<pre>$(esc "$ROLLUP")</pre>"
            fi

            if [ -n "$TREE" ]; then
              out="$out${NL}${NL}Every test — and why each failing one broke — is in the attached <code>$(esc "$TREE_NAME")</code>."
            fi

            # Outside the green/red split on purpose: seeing what the browser did
            # on a passing run is how you find a test that passes for the wrong
            # reason. Not escaped, because it is a URL this workflow built from
            # the upload step's own output, not caller text.
            if [ -n "$VIDEO_URL" ]; then
              out="$out${NL}${NL}🎥 <a href=\"$VIDEO_URL\">the session recording</a> — encrypted, needs the passphrase"
            fi

            printf '%s%s%s<a href="%s">open the run</a>' \
              "$out" "$NL" "$NL" "$RUN_URL"
          }

          # Telegram rejects anything over 4096 characters. Two fallbacks, in the
          # order that loses the least: the rollup goes first because the
          # attached file says the same thing in full, and only then the detail.
          TEXT=$(build yes)
          if [ "${#TEXT}" -gt 3800 ]; then
            echo "Message over the limit — sending it without the per-file rollup."
            TEXT=$(build no)
          fi
          if [ "${#TEXT}" -gt 3800 ]; then
            TEXT="$ICON <b>$(esc "$TITLE")</b>${NL}${LINE}${NL}${NL}Too much detail to send here.${NL}${NL}<a href=\"$RUN_URL\">open the run</a>"
            # Kept in the last-resort message too. It is two lines, and when the
            # detail did not fit it is the fastest way to see what happened.
            if [ -n "$VIDEO_URL" ]; then
              TEXT="$TEXT${NL}🎥 <a href=\"$VIDEO_URL\">the session recording</a>"
            fi
          fi

          HTTP=$(curl -sS -o /tmp/telegram-response.json -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TEXT}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true) || HTTP="000"

          if [ "$HTTP" != "200" ]; then
            echo "Telegram replied $HTTP:"
            cat /tmp/telegram-response.json || true
            echo
            echo "chat not found            → TELEGRAM_CHAT_ID is wrong"
            echo "bot is not a member       → the bot is a subscriber, not an administrator"
            echo "can't parse entities      → the message escaping above broke"
            exit 1
          fi

          echo "Sent."

          # ---------------------------------------------------------------
          # The full list, as an attached file.
          #
          # Every describe and every test with a tick or a cross is about 50KB —
          # twelve times the message limit. As a file it is one upload, it does
          # not flood the channel, and it can be searched in the Telegram viewer.
          #
          # It is a reply to the message just sent, so the two stay together in
          # the channel, and it arrives silently: one run should ping once.
          # ---------------------------------------------------------------
          if [ -z "$TREE" ]; then
            exit 0
          fi

          # The name comes from an input and ends up in a path, so keep it to
          # characters that cannot walk out of the directory.
          SAFE_NAME=$(printf '%s' "$TREE_NAME" | tr -cd 'A-Za-z0-9._-')
          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="tests.txt"
          fi
          printf '%s\n' "$TREE" > "/tmp/$SAFE_NAME"

          # Best effort: without it the file is still sent, just not threaded.
          # Not worth a JSON parser — the first message_id in the reply is the
          # message we just sent.
          MESSAGE_ID=$(sed -n 's/.*"message_id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            /tmp/telegram-response.json | head -n 1) || MESSAGE_ID=""

          REPLY_TO=()
          if [ -n "$MESSAGE_ID" ]; then
            REPLY_TO=(-F "reply_to_message_id=${MESSAGE_ID}")
          fi

          DOC_HTTP=$(curl -sS -o /tmp/telegram-document.json -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F "chat_id=${TG_CHAT}" \
            -F "document=@/tmp/${SAFE_NAME}" \
            -F "caption=every test in this run, with the reason under each failure" \
            -F "disable_notification=true" \
            "${REPLY_TO[@]}") || DOC_HTTP="000"

          if [ "$DOC_HTTP" != "200" ]; then
            # The message is the notification; the attachment is the detail. A
            # failed upload is worth seeing in this log and is never a reason to
            # report the run itself differently.
            echo "The test list did not upload — Telegram replied $DOC_HTTP:"
            cat /tmp/telegram-document.json || true
            echo
            exit 1
          fi

          echo "Test list attached ($(wc -c < "/tmp/$SAFE_NAME") bytes)."
