# The browser suite, against real staging: every Friday, or by hand. It tests
# `main`.
#
# It drives a real `next build` + `next start` in Chromium against the real
# staging backends. See docs/testing/E2E_TEST_DESIGN.md.
#
# ---------------------------------------------------------------------------
# Why this is its own file and not a job in tests.yml
#
# tests.yml sets `cancel-in-progress: true` at the workflow level, which cancels
# the entire run — every job in it — as soon as another run starts on the same
# ref. A job-level concurrency group does not protect a job from that.
#
# The suite needs its own group, and that is why it needs its own file. It must
# never be cancelled by an unrelated job in tests.yml, and it must hold one lock
# that is shared across refs and across the Friday run — which a job inside
# tests.yml cannot have separately from the rest of that workflow.
# ---------------------------------------------------------------------------
#
# **Never on a pull request, and never on a push.** Only two events start it:
#
#   * `schedule` — every Friday at 02:30 UTC. GitHub reads `schedule:` only
#     from the default branch, `main`, so the run tests `main`.
#   * `workflow_dispatch` — by hand, from the Actions tab or
#     `gh workflow run E2E --ref main`. It tests the ref you pick.
#
# Why never on a pull request, and both reasons still hold:
#
#   * A pull request must not be blocked because staging is down. A red check on
#     a pull request has to mean "the code broke", nothing else.
#   * It needs staging secrets, and a pull request from a fork never gets them.
#
# ---------------------------------------------------------------------------
# This file has to exist on `main`, and so does `e2e-lane.yml`
#
# The copy on `main` is the one the Friday run uses. A run started from this
# file calls `./.github/workflows/e2e-lane.yml` from the same ref, so a `main`
# that has this file without that one fails the Friday run at once with
# "workflow not found". Any edit to either needs to reach `main`, or the copy
# that runs on Friday is the old one.
#
# **Deploys no longer wait for this.** `deploy.yml` used to start when a push
# run of this workflow finished. There are no push runs now, so deploying is by
# hand only — see the note at the top of `deploy.yml`.
# ---------------------------------------------------------------------------

name: E2E

on:
  schedule:
    # Friday, 02:30 UTC. Off the hour on purpose — the top of the hour is when
    # every scheduled workflow on the platform queues at once.
    - cron: '30 2 * * 5'
  workflow_dispatch:

# **One global group, and a run is never cancelled.**
#
# `live-suite` is shared with every other run of this workflow, so the Friday
# run and a run started by hand can never be in the same staging shop at the
# same time. Two runs adding to one cart break each other for reasons that look
# exactly like product bugs.
#
# `cancel-in-progress: false`, so a second run waits in the queue instead of
# killing the first. That is what keeps the `orders` fixture teardown
# (`tests/e2e/fixtures.ts`) safe: a run is never killed mid-checkout, so it
# always reaches the orphan net and cancels any order the journey left live on
# staging. The old value, `true`, existed only so a new push did not wait for
# the previous push run. There are no push runs any more, so nothing is gained
# by cancelling.
#
# GitHub keeps at most one run waiting per group. If a third run starts while
# one runs and one waits, the waiting one is dropped, not the running one.
concurrency:
  group: live-suite
  cancel-in-progress: false

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Two lanes, run at the same time
#
# The work itself is in `e2e-lane.yml`, called once per lane. Why the split
# exists, why the worker counts are what they are, and why the lane lists live
# in `tests/e2e/cli.ts` rather than in YAML, are all written at the top of that
# file. This file decides only *when* the suite runs.
#
# **The `live-suite` lock above still covers both**, and that matters: the two
# lanes are jobs of one run, so the group keeps one E2E *run* in the staging
# shop at a time while letting the two lanes inside it run together. A second
# group per lane would have been wrong — it would let a hand-started run's
# account lane and the Friday run's account lane into the same shop at once.
#
# `account` is the gate: it holds the money path, the sign-in and every real
# write. `solo` is guests and faked answers. Each lane fails on its own, and
# each sends its own Telegram message, so a red check always names the lane that
# broke and no message reports one lane's numbers as if they were the whole run.
#
# Adding a spec file does not need an edit here. It needs a line in one of the
# two lane lists in `tests/e2e/cli.ts`, and that file refuses to run a lane
# until every spec on disk is in exactly one of them.
# ---------------------------------------------------------------------------

jobs:
  account:
    uses: ./.github/workflows/e2e-lane.yml
    with:
      lane: account
    secrets: inherit

  solo:
    uses: ./.github/workflows/e2e-lane.yml
    with:
      lane: solo
    secrets: inherit

