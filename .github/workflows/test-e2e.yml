# The browser suite, against real staging.
#
# It drives a real `next build` + `next start` in Chromium against the real
# staging backends. See docs/testing/E2E_TEST_DESIGN.md.
#
# ---------------------------------------------------------------------------
# Why this is its own file and not a job in tests.yml
#
# tests.yml sets `cancel-in-progress: true` at the workflow level, which cancels
# the entire run — every job in it — as soon as another push lands on the same
# branch. A job-level concurrency group does not protect a job from that.
#
# The suite still needs its own group, and that is why it needs its own file. It
# is cancelled by a newer push of its own (see `concurrency` below), but it must
# never be cancelled by an unrelated job in tests.yml, and it must hold one lock
# that is shared across branches and across the nightly — which a job inside
# tests.yml cannot have separately from the rest of that workflow.
# ---------------------------------------------------------------------------
#
# **Never on a pull request.** Two reasons, and both are load-bearing:
#
#   * A pull request must not be blocked because staging is down. A red check on
#     a pull request has to mean "the code broke", nothing else.
#   * It needs staging secrets, and a pull request from a fork never gets them.
#     Gating on push and schedule keeps forks working.
#
# ---------------------------------------------------------------------------
# This file has to exist on `main`, and so does `e2e-lane.yml`
#
# GitHub reads `schedule:` and `workflow_dispatch:` only from the **default**
# branch, which in this repository is `main`. While this file lived on `development`
# alone the cron below was never armed: every run in the history was a `push`,
# and the nightly silently never happened.
#
# So `main` carries the workflow files — and only those — out of `development`. It
# does not carry the suite: `main` is the staging gate and has no `tests/`, no
# Playwright config and no `e2e:*` scripts. That shapes the two rules below:
# nothing here triggers on a push to `main`, and a scheduled run checks out
# `development` (the `ref:` for that is in `e2e-lane.yml`, which is where the
# checkout now lives).
#
# **Two files now, and both must travel.** A run started from this file calls
# `./.github/workflows/e2e-lane.yml` from the same ref, so a `main` that has
# this file without that one fails the nightly immediately with "workflow not
# found". Any edit to either needs a pull request to `main` as well as to
# `development`, or the copies drift and the one that runs the nightly is the stale
# one.
# ---------------------------------------------------------------------------

name: E2E

on:
  # **`development` only.** `main` carries this file (see above) but not the suite,
  # so a push to `main` that started this workflow would die on
  # `pnpm e2e:preflight` — script not found — and paint the staging branch red
  # for tests it does not contain. Add `main` back on the day `development` is
  # merged up and `main` carries the tooling.
  push:
    branches: [development]
  schedule:
    # Nightly, 02:30 UTC. Off the hour on purpose — the top of the hour is when
    # every scheduled workflow on the platform queues at once.
    - cron: '30 2 * * *'
  workflow_dispatch:

# **One global group, and the newest push wins.**
#
# `live-suite` is shared with every other run of this workflow, so a merge and
# the nightly can never be in the same staging shop at the same time. Two runs
# adding to one cart break each other for reasons that look exactly like product
# bugs. That half has not changed.
#
# `cancel-in-progress: true` is a deliberate trade, made because the suite takes
# about half an hour and waiting it out told nobody anything about the code that
# had just been pushed. The old value bought one thing, and this is what it cost
# and what it now costs:
#
#   * **What was bought:** a run is never killed mid-checkout, so the `orders`
#     fixture teardown (`tests/e2e/fixtures.ts`) always reaches the orphan net
#     and cancels any order the journey left live on staging.
#   * **What it cost:** every push waited for the previous run to finish before
#     it learned anything.
#   * **What this now costs:** a cancelled run may have an order on staging and
#     only a few seconds to cancel it — GitHub sends SIGINT, then kills. So the
#     net can miss. If an order is found live on staging with nobody claiming
#     it, a cancelled run is the first place to look, and `workflow_dispatch`
#     re-runs the suite when nothing else is in the group.
concurrency:
  group: live-suite
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Two lanes, run at the same time
#
# The work itself is in `e2e-lane.yml`, called once per lane. Why the split
# exists, why the worker counts are what they are, and why the lane lists live
# in `tests/e2e/cli.ts` rather than in YAML, are all written at the top of that
# file. This file decides only *when* the suite runs.
#
# **The `live-suite` lock above still covers both**, and that matters: the two
# lanes are jobs of one run, so the group keeps one E2E *run* in the staging
# shop at a time while letting the two lanes inside it run together. A second
# group per lane would have been wrong — it would let a merge's account lane and
# the nightly's account lane into the same shop at once.
#
# `account` is the gate: it holds the money path, the sign-in and every real
# write. `solo` is guests and faked answers. Each lane fails on its own, and
# each sends its own Telegram message, so a red check always names the lane that
# broke and no message reports one lane's numbers as if they were the whole run.
#
# Adding a spec file does not need an edit here. It needs a line in one of the
# two lane lists in `tests/e2e/cli.ts`, and that file refuses to run a lane
# until every spec on disk is in exactly one of them.
# ---------------------------------------------------------------------------

jobs:
  account:
    uses: ./.github/workflows/e2e-lane.yml
    with:
      lane: account
    secrets: inherit

  solo:
    uses: ./.github/workflows/e2e-lane.yml
    with:
      lane: solo
    secrets: inherit

